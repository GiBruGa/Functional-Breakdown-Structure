<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UrBizia - FBS v12.0</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://gibruga.github.io/EkoMa/auth-gate.js"></script>
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<link rel="stylesheet" href="fbs.css">
<script src="exceljs.min.js"></script>
</head>
<body>
<div id="auth-overlay" style="position:fixed;inset:0;z-index:3000;background:rgba(10,13,20,0.97);display:flex;align-items:center;justify-content:center">
  <div style="text-align:center;max-width:360px;width:90%;padding:32px;background:var(--bg2);border:1px solid var(--border2);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.7)">
    <img id="logo-app-login" style="width:56px;height:56px;object-fit:contain;margin-bottom:10px;">
    <div style="font-size:22px;font-weight:bold;margin-bottom:4px;font-family:var(--wordmark-font)"><span style="color:var(--brand-pink)">FBS</span> <span style="font-size:11px;font-weight:400;color:var(--text3);">v12.0</span></div>
    <div style="display:flex;align-items:center;justify-content:center;gap:4px;font-size:10px;color:var(--text3);margin-bottom:12px;"><img id="logo-footer-auth" alt="UrBizia" style="height:11px;width:auto;object-fit:contain;opacity:.85;"> est un service UrBizia</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:16px">Connexion requise</div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:20px;line-height:1.6">Cet outil se pilote depuis EkoMa. Connectez-vous sur EkoMa puis ouvrez FBS depuis son tableau de bord.</div>
    <a href="https://gibruga.github.io/EkoMa/" style="display:block;box-sizing:border-box;width:100%;padding:10px;font-size:13px;font-weight:bold;background:#540E28;color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:inherit;text-decoration:none">Aller sur EkoMa</a>
    <div id="auth-error" style="color:#f87171;font-size:11px;margin-top:12px;min-height:14px"></div>
  </div>
</div>
<div id="toolbar">
  <div id="app-title">
    <img id="logo-app-title" alt="UrBizia Logo">
    <div>
      <div class="name" style="color:var(--brand-pink);">FBS <span style="font-size:9px;font-weight:400;color:var(--text3);">v12.0</span></div>
      <div class="sub" style="display:flex;align-items:center;gap:4px;"><img id="logo-footer-apptitle" alt="UrBizia" style="height:10px;width:auto;object-fit:contain;opacity:.85;"> est un service UrBizia</div>
    </div>
  </div>
  <div class="sep"></div>
  <div class="stat">EF:<span style="color:#93c5fd;font-family:monospace" id="s-ef">-</span></div>
  <div class="stat">CC:<span style="color:#5eead4;font-family:monospace" id="s-cc">-</span></div>
  <div class="stat">Multi:<span style="color:#f59e0b;font-family:monospace" id="s-mul">-</span></div>
  <div class="sep"></div>
  <div class="tgrp">
    <button id="tab-fbs" class="active" onclick="switchTab('fbs')">Editions</button>
    <button id="tab-orphans" onclick="switchTab('orphans')">Orphelins <span id="orphan-count" style="background:#7f1d1d;color:#fca5a5;border-radius:8px;padding:0 5px;font-size:9px"></span></button>
  </div>
  <div class="sep"></div>
  <select class="fil-sel" id="fil-application" onchange="filterApplication=this.value;renderTree()"></select>
  <select class="fil-sel" id="fil-besoin" onchange="filterBesoin=this.value;renderTree()"></select>
  <select class="fil-sel" id="fil-risque" onchange="filterRisque=this.value;renderTree()"></select>
  <select class="fil-sel" id="fil-phase"  onchange="filterPhase=this.value;renderTree()"></select>
  <div class="sep"></div>
  <div class="fgrp">
    <button id="f-all" class="a-all" onclick="setFilter('ALL')">Tout</button>
    <button id="f-ef" onclick="setFilter('EF')">EF</button>
    <button id="f-cc" onclick="setFilter('CC')">CC</button>
  </div>
  <input id="search" type="text" placeholder="Rechercher..." oninput="onSearch(this.value)">
  <div class="spacer"></div>
  <button id="btn-import" class="btn" onclick="doImport()" style="display:none">Import</button>
  <button class="btn" onclick="doExport()" title="Export json">Export json</button>
  <button class="btn" onclick="exportWord()" title="Export Word : prompt de demande d etude (FBS complete ou filtree)" style="background:#1d3a5f;color:#93c5fd;border-color:#2563eb">Prompt Word</button>
  <button class="btn" onclick="exportExcel()" title="Export Excel" style="background:#0d3b2a;color:#5eead4;border-color:#0d9488">Excel</button>
  <button id="btn-reset" class="btn danger" onclick="doReset()" style="display:none">Reset</button>
  <div class="sep"></div>
  <button class="btn" onclick="refreshFromSupabase()" title="Recharger les dernieres donnees depuis Supabase">⟳ Actualiser</button>
  <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <span id="user-email" style="font-size:10px;color:var(--text3)"></span>
    <button class="btn" onclick="doSignOut()">Se deconnecter</button>
  </div>
</div>
<div id="main">
  <div id="tree-panel">
    <div id="depth-bar"><button class="btn primary" style="font-size:10px;padding:2px 8px;margin-right:8px" onclick="openCreate()">+ Nouveau</button><span>Niv:</span></div>
    <div id="filter-banner"></div>
    <div id="tree-scroll"></div>
  </div>
  <div id="splitter-fbs" style="width:6px;cursor:col-resize;background:var(--border);flex-shrink:0"></div>
  <div id="detail-panel">
    <div id="detail-scroll"></div>
  </div>
  <div id="sow-panel">
    <div class="sow-hdr" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h3 style="margin:0">Reponses SOW recues</h3><button class="btn primary" style="font-size:10px" onclick="importSowResponses()">Importer reponses RFQ</button><span id="sow-info" style="font-size:10px;color:var(--text3)"></span></div>
    <div id="sow-scroll" style="flex:1;overflow-y:auto;padding:12px"></div>
  </div>
  <div id="orphans-panel" style="flex:1;overflow:hidden;display:none;flex-direction:column">
    <div class="sow-hdr"><h3 style="color:#fca5a5">Lignes Orphelines (non rattachées à l’arborescence)</h3></div>
    <div id="orphans-scroll" style="flex:1;overflow-y:auto;padding:10px"></div>
  </div>
</div>
<div id="ctx-menu">
  <button onclick="ctxAddChild('EF')">Ajouter un EF en-dessous</button>
  <button onclick="ctxAddChild('CC')">Ajouter un CC en-dessous</button>
  <button onclick="ctxDuplicate()">Dupliquer...</button>
  <div class="ctx-sep"></div>
  <button onclick="ctxExportWord()">Exporter en prompt Word (cet element + branches)</button>
  <div class="ctx-sep"></div>
  <button onclick="ctxDelete()" style="color:#f87171">Detacher de ce parent</button>
</div>
<div id="mo" class="mo">
  <div class="modal" id="modal">
    <div class="modal-head"><h3 id="modal-title"></h3><button class="mc" onclick="closeModal()">&#215;</button></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>
<script src="fbs.js"></script>
</body>
</html>
